# Netlify deployment config for BuildLog
# - Frontend: Vite build output in dist/
# - Backend: Express app (src/server/app.ts) runs as a single Netlify Function

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  included_files = ["firebase-applet-config.json"]

# All API traffic (incl. GitHub webhooks) goes to the Express function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
